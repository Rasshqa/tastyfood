name: tasty_food
description: "Padang Rice Admin Mobile - Aplikasi admin untuk mengelola operasional restoran."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # HTTP & API
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2

  # Navigation
  go_router: ^14.6.1

  # Utility
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0

  # UI
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Maps
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Realtime / Push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
